<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Wawasan hukum dan publikasi terkini dari SSG &amp; Partners.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="assets/site-shell.css">
    <link rel="stylesheet" href="assets/insights.css">
    <link rel="stylesheet" href="assets/insights-recognition.css?v=20260924">

    <style>
      .featured-card {
        min-height: 0;
      }

      .featured-image {
        min-height: 0;
        aspect-ratio: 16 / 9;
        align-self: start;
      }

      .content-card-link,
      .featured-card-link {
        display: block;
        height: 100%;
        color: inherit;
      }

      .featured-card-link {
        display: grid;
      }

      .content-card-link:hover h2,
      .featured-card-link:hover h2 {
        text-decoration: underline;
        text-decoration-color: var(--burgundy);
      }

      @media (max-width: 820px) {
        .featured-image {
          min-height: 0;
        }
      }
    </style>

    <title>Wawasan &amp; Publikasi | SSG &amp; Partners</title>
  </head>

  <body
    data-page="insights"
    data-title-id="Wawasan &amp; Publikasi | SSG &amp; Partners"
    data-title-en="Insights &amp; Publications | SSG &amp; Partners"
    data-description-id="Wawasan hukum dan publikasi terkini dari SSG &amp; Partners."
    data-description-en="Read the latest legal insights and publications from SSG &amp; Partners."
  >
    <div data-site-header></div>

    <main>
      <section class="insights-hero">
        <div class="container insights-hero-grid">
          <div>
            <h1 class="insights-title" data-i18n data-id="Wawasan Hukum &amp; Publikasi Terkini" data-en="Latest Legal Insights &amp; Publications">Wawasan Hukum &amp; Publikasi Terkini</h1>
            <p class="insights-lead"></p>
          </div>

          <form class="search-box" data-search-form role="search">
            <input
              data-search-input
              type="search"
              placeholder="Cari yurisprudensi, regulasi, atau kata kunci…"
              data-placeholder-id="Cari yurisprudensi, regulasi, atau kata kunci…"
              data-placeholder-en="Search case law, regulations, or keywords…"
              aria-label="Cari publikasi"
              data-aria-id="Cari publikasi"
              data-aria-en="Search publications"
            >
            <button type="submit" data-i18n data-id="Cari" data-en="Search">Cari</button>
          </form>
        </div>
      </section>

      <section class="insights-content">
        <div class="container">
          <div class="filters-bar">
            <div class="filters" aria-label="Filter konten" data-aria-id="Filter konten" data-aria-en="Content filters">
              <button class="filter-button" type="button" data-filter="all" aria-pressed="true" data-i18n data-id="Semua" data-en="All">Semua</button>
              <button class="filter-button" type="button" data-filter="wawasan" aria-pressed="false" data-i18n data-id="Wawasan" data-en="Insights">Wawasan</button>
              <button class="filter-button" type="button" data-filter="publikasi" aria-pressed="false" data-i18n data-id="Publikasi" data-en="Publications">Publikasi</button>
              <button class="filter-button" type="button" data-filter="carousel" aria-pressed="false" data-i18n data-id="Edukasi" data-en="Education">Edukasi</button>
              <button class="filter-button" type="button" data-filter="external" aria-pressed="false" data-i18n data-id="Penghargaan &amp; Liputan" data-en="Recognition &amp; Media" hidden>Penghargaan &amp; Liputan</button>
            </div>
            <a class="recognition-overview-link" href="recognition.html" data-i18n data-id="Lihat rekam jejak terverifikasi →" data-en="View verified track record →">Lihat rekam jejak terverifikasi →</a>
          </div>

          <div data-content-area>
            <p class="empty-state" data-i18n data-id="Memuat publikasi…" data-en="Loading publications…">Memuat publikasi…</p>
          </div>

          <p class="results-count" data-results-count></p>
          <nav class="pagination" data-pagination aria-label="Halaman publikasi" data-aria-id="Halaman publikasi" data-aria-en="Publication pages"></nav>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="assets/site-shell.js?v=20260922-en"></script>
    <script type="module" src="assets/insights.js?v=20260924-recognition-dedup"></script>
  </body>
</html>
